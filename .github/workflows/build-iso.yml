name: Build Nebys OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm --needed archiso grub syslinux git

      - name: Prepare writable machine-id
        shell: bash
        run: |
          set -eux
          rm -f /etc/machine-id
          dbus-uuidgen --ensure=/etc/machine-id

      - name: Build ISO
        shell: bash
        run: |
          set -eux
          mkdir -p out work
          mkarchiso -v -w ./work -o ./out .

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebysos-iso
          path: out/*.iso
          if-no-files-found: error
