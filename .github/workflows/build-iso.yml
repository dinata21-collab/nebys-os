name: Build Nebys OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso grub syslinux
          which grub-install
          grub-install --version

      - name: Build ISO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out work
          mkarchiso -v -w ./work -o ./out .

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebysos-iso
          path: out/*.iso
          if-no-files-found: error
