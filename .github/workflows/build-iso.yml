name: Build Nebys OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          sudo pacman -Sy --noconfirm archlinux-keyring
          sudo pacman -S --noconfirm --needed archiso grub syslinux

      - name: Build ISO
        shell: bash
        run: |
          set -eux
          mkdir -p out work
          sudo mkarchiso -v -w ./work -o ./out .

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebysos-iso
          path: out/*.iso
          if-no-files-found: error
